    <script>
      (function () {
        try {
          var saved = localStorage.getItem('site-theme')
          document.documentElement.setAttribute(
            'data-theme',
            saved === 'light' ? 'light' : 'dark'
          )
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
