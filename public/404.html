<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — BuildWise Webs</title>
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#08101f" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <style>
      :root {
        color-scheme: dark;
        --text: #eef2ff;
        --muted: #9fb7ff;
        --link: #7d99ff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
        text-align: center;
        color: var(--text);
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        line-height: 1.7;
        background:
          radial-gradient(60rem 45rem at 82% 6%, rgba(37, 99, 255, 0.28), transparent 60%),
          linear-gradient(180deg, #08101f 0%, #091225 28%, #0b172d 100%);
      }
      img { width: 180px; height: auto; margin: 0 auto 2rem; display: block; }
      p.eyebrow {
        text-transform: uppercase;
        letter-spacing: 0.18em;
        font-size: 0.8rem;
        color: var(--muted);
        margin: 0 0 0.5rem;
      }
      h1 { font-size: clamp(2rem, 5vw, 3rem); margin: 0 0 1rem; }
      p.lead { color: var(--muted); max-width: 34rem; margin: 0 auto 2rem; }
      .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
      a.btn {
        display: inline-block;
        padding: 0.8rem 1.5rem;
        border-radius: 999px;
        font-weight: 700;
        text-decoration: none;
        border: 1px solid rgba(255, 255, 255, 0.16);
        color: var(--text);
      }
      a.btn-primary { background: #3c5cff; border-color: transparent; }
      nav { margin-top: 2rem; display: flex; flex-wrap: wrap; gap: 1.25rem; justify-content: center; }
      nav a { color: var(--muted); text-decoration: none; font-size: 0.9rem; }
      nav a:hover { color: var(--link); }
    </style>
  </head>
  <body>
    <main>
      <img src="/buildWiseWebsDark.webp" alt="BuildWise Webs" width="224" height="84" />
      <p class="eyebrow">404</p>
      <h1>That page does not exist</h1>
      <p class="lead">
        The link may be out of date or mistyped. Everything on BuildWise Webs is one click away below.
      </p>
      <div class="actions">
        <a class="btn btn-primary" href="/">Back to Home</a>
        <a class="btn" href="/contact">Contact</a>
      </div>
      <nav>
        <a href="/services">Services</a>
        <a href="/portfolio">Portfolio</a>
        <a href="/faq">FAQ</a>
        <a href="/contact">Contact</a>
      </nav>
    </main>
  </body>
</html>
